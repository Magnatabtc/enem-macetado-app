# Nginx do Enem Macetado — SPA + proxy reverso para a API.
#
# Este arquivo é um bloco `server` (contexto http). O Dockerfile do frontend
# deve copiá-lo por cima do default da imagem:
#
#   COPY deploy/nginx.conf /etc/nginx/conf.d/default.conf
#
# O SPA é servido de /usr/share/nginx/html (build do Vite).

# Limite por IP nas rotas de autenticação (força bruta / cadastros em massa).
# Fica no contexto http (este arquivo é incluído em conf.d) e vale só no
# location /api/auth/ abaixo.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Não revela a versão do Nginx em respostas e páginas de erro.
    server_tokens off;

    # Upload de áudio do tutor via API (base64) e payloads grandes.
    client_max_body_size 12m;

    # gzip apenas para texto; mídia já vem comprimida.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Cabeçalhos de segurança (herdados por locations que não usam add_header).
    # CSP:
    #   font-src 'self'        → fontes @fontsource empacotadas, sem CDN
    #   style-src 'unsafe-inline' → estilos inline do React/Tailwind
    #   connect-src ws: wss:   → WebSocket do tutor em /ws/tutor
    #   media-src blob: data:  → MediaRecorder e áudio TTS em base64
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Assets do Vite têm hash no nome → cache imutável de 1 ano.
    # add_header NÃO é herdado quando o location define add_header, então os
    # cabeçalhos de segurança são repetidos aqui de propósito.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        try_files $uri =404;
    }

    # O index.html nunca é cacheado: precisa apontar para o bundle novo.
    # `expires -1` não usa add_header, então os cabeçalhos do server valem.
    location = /index.html {
        expires -1;
    }

    # Autenticação: mesmo proxy da API, com limite por IP. Prefixo mais
    # específico que /api/, então estas rotas passam por aqui.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API REST → api:8080. Sem barra final no proxy_pass para preservar /api/.
    # Obs.: o host `api` é resolvido no boot do Nginx. Se o container da API for
    # recriado sozinho e o IP mudar, reinicie o web (`make rebuild` recria tudo).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket do tutor → api:8080.
    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # Upgrade literal: /ws/ só atende WebSocket; evita depender de `map`.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Sessão longa de tutor: sem buffering e sem timeout curto.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: qualquer rota do React Router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueia dotfiles (.git, .env etc.), exceto desafios ACME se um dia houver.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
